services:
  
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"

  frontend:
    build: ./frontend/
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
  
  
  middleware:
    build: ./Gateway/
    ports:
      - "8080:8080"
    depends_on:
      - db
      - authbe1
      - authbe2
      - authbe3
      - logsbe1
      - logsbe2
      - logsbe3
      - usersbe1
      - usersbe2
      - usersbe3

  db:
    build: ./DB/
    ports:
      - "5432:5432"

  authbe1:
    build: ./auth/
    ports:
      - "8003:8080"
    environment:
      - INSTANCE_ID=authbe1
      - GRPC_PORT=9090
      - LOGS_GRPC_ADDR=logsbe1:9090
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      - db
      - consul

  authbe2:
