services:
  
  frontend:
    build: ./frontend/
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
  
  
  middleware:
    build: ./Gateway/
    ports:
      - "8080:8080"
    depends_on:
      - authbe1
      - authbe2
      - authbe3
      - logsbe1
      - logsbe2
      - logsbe3
      - usersbe1
      - usersbe2
      - usersbe3

  db:
    build: ./DB/
    ports:
      - "5432:5432"

  authbe1:
    build: ./auth/
    ports:
      - "8003:8080"
    environment:
      - INSTANCE_ID=authBE1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  authbe2:
    build: ./auth/
    ports:
      - "8004:8080"
    environment:
      - INSTANCE_ID=authBE2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware
  authbe3:
    build: ./auth/
    ports:
      - "8005:8080"
    environment:
      - INSTANCE_ID=authBE3
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware
  logsbe1:
    build: ./logs/
    ports:
      - "8006:8080"
    environment:
      - INSTANCE_ID=logsBE1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware


  logsbe2:
    build: ./logs/
    ports:
      - "8007:8080"
    environment:
      - INSTANCE_ID=logsBE2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  logsbe3:
    build: ./logs/
    ports:
      - "8008:8080"
    environment:
      - INSTANCE_ID=logsBE3
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  usersbe1:
    build: ./users/
    ports:
      - "8009:8080"
    environment:
      - INSTANCE_ID=usersBE1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  usersbe2:
    build: ./users/
    ports:
      - "8010:8080"
    environment:
      - INSTANCE_ID=usersBE2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  usersbe3:
    build: ./users/
    ports:
      - "8011:8080"
    environment:
      - INSTANCE_ID=usersBE3
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - MIDDLEWARE_HOST=middleware

  

  
