      - "8006:8080"
    environment:
      - INSTANCE_ID=logsBE1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - LB_HOST=logslb

  logsbe2:
    build: ./logs/
    ports:
      - "8007:8080"
    environment:
      - INSTANCE_ID=logsBE2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
