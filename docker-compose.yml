services:
  
  frontend:
    build: ./frontend/
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_HOST}
  
  
  middleware:
    build: ./Middleware/
    ports:
      - "8080:80"

  authlb:
    build: ./loadbalancer/
    ports:
      - "8000:8080"
    environment:
      - INSTANCE_ID=authLB

  logslb:
    build: ./loadbalancer/
    ports:
      - "8001:8080"
    environment:
      - INSTANCE_ID=logsLB

  userslb:
    build: ./loadbalancer/
    ports:
      - "8002:8080"
    environment:
      - INSTANCE_ID=usersLB

  db:
    build: ./DB/
    ports:
      - "5432:5432"

  authbe1:
    build: ./auth/
    ports:
      - "8003:8080"
    environment:
      - INSTANCE_ID=authBE1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - LB_HOST=authlb
      - LOG_LB_HOST=logslb

  authbe2:
    build: ./auth/
    ports:
      - "8004:8080"
    environment:
      - INSTANCE_ID=authBE2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=rbacdb
      - LB_HOST=authlb
      - LOG_LB_HOST=logslb

