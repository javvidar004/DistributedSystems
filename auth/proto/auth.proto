syntax = "proto3";

package auth.v1;

option go_package = "proyecto.com/m/pb;pb";

service AuthService {
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (MessageResponse);
  rpc DeleteUser(DeleteUserRequest) returns (MessageResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RegisterRequest {
  string name = 1;
  string last_name = 2;
  string email = 3;
  string work_position = 4;
  double salary = 5;
  string password = 6;
}

message UpdatePasswordRequest {
  string email = 1;
  string old_password = 2;
  string new_password = 3;
}

message DeleteUserRequest {
  string user_id = 1;
}

message HeartbeatRequest {}

message User {
  string id = 1;
  string email = 2;
  bool is_active = 3;
  string role = 4;
  string group = 5;
  string created_at = 6;
  string updated_at = 7;
}

message AuthResponse {
  string message = 1;
  User user = 2;
}

message MessageResponse {
  string message = 1;
}

message HeartbeatResponse {
  string message = 1;
  string instance_id = 2;
}
