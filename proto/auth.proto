syntax = "proto3";

package pb;
option go_package = "./pb";

// Servicio que expone los endpoints de Autenticación
service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

// Mensaje de solicitud de inicio de sesión
message LoginRequest {
  string username = 1;
  string password = 2;
}

// Respuesta con JWT o credenciales del usuario
message LoginResponse {
  string token = 1;
  string user_id = 2;
  string role = 3;
  string message = 4;
}

// Solicitud para validar JWT
message ValidateTokenRequest {
  string token = 1;
}

// Respuesta del estado de validación
message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}